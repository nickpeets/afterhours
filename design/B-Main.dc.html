<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B Lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Archivo:wght@400;500;600;700&family=Azeret+Mono:wght@600;700&display=swap">
<style>
body{margin:0;background:#f6f1ea}
a{color:#e8174f}a:hover{color:#b00f3a}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#f6f1ea;color:#141413;font-family:Archivo,sans-serif;position:relative;overflow:hidden">
  <!-- masthead -->
  <div style="display:flex;align-items:baseline;justify-content:space-between;padding:56px 20px 8px;border-bottom:2px solid #141413;margin:0 16px">
    <div style="font-family:Fraunces,serif;font-weight:800;font-size:26px;letter-spacing:-.02em">Last Call</div>
    <div style="font-family:'Azeret Mono',monospace;font-size:9px;letter-spacing:.2em;color:#6b655c">THU · OCT 22 · PORTLAND</div>
  </div>
  <!-- the ticket: tonight's show -->
  <div style="margin:14px 16px 0;background:#fff;border:1.5px solid #141413;border-radius:14px;position:relative;overflow:hidden;box-shadow:4px 4px 0 #141413">
    <div style="display:flex">
      <div style="flex:1;padding:14px 16px">
        <div style="font-family:'Azeret Mono',monospace;font-size:9px;letter-spacing:.2em;color:#e8174f">TONIGHT · 8:00 PM</div>
        <div style="font-family:Fraunces,serif;font-weight:800;font-size:28px;line-height:1;letter-spacing:-.02em;margin-top:6px">Thursday Night</div>
        <div style="font-size:13px;color:#6b655c;margin-top:4px">hosted by <span style="color:#141413;font-weight:600">Marla</span> · 14 going</div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button style="border:1.5px solid #141413;border-radius:999px;padding:9px 16px;background:#e8174f;color:#fff;font-weight:700;font-size:14px;box-shadow:2px 2px 0 #141413">I'm going</button>
          <button style="border:1.5px solid #141413;border-radius:999px;padding:9px 14px;background:#fff;color:#141413;font-weight:700;font-size:14px">Remind me</button>
        </div>
      </div>
      <div style="width:84px;border-left:1.5px dashed #141413;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#fbe8ee">
        <div style="font-family:'Azeret Mono',monospace;font-size:9px;letter-spacing:.2em;color:#6b655c;writing-mode:vertical-rl;transform:rotate(180deg)">ADMIT ONE</div>
        <div style="font-family:Fraunces,serif;font-weight:800;font-size:22px;color:#e8174f">№14</div>
      </div>
    </div>
  </div>
  <!-- your two doors -->
  <div style="display:flex;gap:8px;margin:12px 16px 0">
    <button style="flex:1;border:1.5px solid #141413;border-radius:999px;padding:12px;background:#141413;color:#fff;font-weight:700;font-size:14px">● Go live</button>
    <button style="flex:1;border:1.5px dashed #141413;border-radius:999px;padding:12px;background:transparent;color:#141413;font-weight:700;font-size:14px">Schedule</button>
  </div>
  <!-- the deck as a program page -->
  <div style="display:flex;align-items:baseline;justify-content:space-between;margin:20px 16px 8px">
    <div style="font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:18px">Tonight's contestants</div>
    <div style="font-family:'Azeret Mono',monospace;font-size:9px;letter-spacing:.2em;color:#6b655c">11 · SWIPE</div>
  </div>
  <div style="position:relative;margin:0 16px;height:372px">
    <div style="position:absolute;inset:0;transform:translate(6px,10px);background:#fff;border:1.5px solid #141413;border-radius:16px"></div>
    <div style="position:absolute;inset:0;background:#fff;border:1.5px solid #141413;border-radius:16px;overflow:hidden;box-shadow:4px 4px 0 #141413">
      <div style="height:236px;background:linear-gradient(160deg,#e9c9b6,#c98a7a 60%,#7c4a4a);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:800;font-size:120px;color:rgba(255,255,255,.55)">D</div>
      <div style="position:absolute;top:10px;left:10px;font-family:'Azeret Mono',monospace;font-size:9px;letter-spacing:.2em;color:#141413;background:#fff;border:1.5px solid #141413;border-radius:999px;padding:5px 9px">★ FAN FAVORITE</div>
      <div style="position:absolute;top:10px;right:10px;font-family:'Azeret Mono',monospace;font-size:11px;font-weight:700;color:#fff;background:#e8174f;border:1.5px solid #141413;border-radius:999px;padding:4px 9px">♥ 32</div>
      <div style="padding:12px 14px 14px;border-top:1.5px solid #141413">
        <div style="display:flex;align-items:baseline;gap:8px"><div style="font-family:Fraunces,serif;font-weight:800;font-size:28px;line-height:1;letter-spacing:-.02em">Dex</div><div style="font-family:'Azeret Mono',monospace;font-size:14px;color:#6b655c">32 · Portland</div></div>
        <div style="display:flex;gap:14px;margin-top:8px;font-family:'Azeret Mono',monospace;font-size:10px;letter-spacing:.12em;color:#6b655c"><span><b style="color:#141413">6</b> SHOWS</span><span><b style="color:#141413">1</b> KEEP</span><span><b style="color:#141413">32</b> HEARTS</span></div>
        <div style="margin-top:8px;font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:16px;line-height:1.3">“My last call is usually two whiskeys and a long goodbye.”</div>
      </div>
    </div>
  </div>
  <div style="display:flex;justify-content:center;gap:24px;margin-top:16px">
    <button aria-label="Pass" style="width:60px;height:60px;border-radius:50%;border:1.5px solid #141413;background:#fff;color:#141413;font-size:22px;box-shadow:3px 3px 0 #141413">✕</button>
    <button aria-label="Heart" style="width:60px;height:60px;border-radius:50%;border:1.5px solid #141413;background:#e8174f;color:#fff;font-size:24px;box-shadow:3px 3px 0 #141413">♥</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
