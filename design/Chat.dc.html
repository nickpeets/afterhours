<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matches and Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Archivo:wght@400;500;600;700&family=Azeret+Mono:wght@600;700&family=Monoton&display=swap">
<style>
body{margin:0;background:#080b20}
a{color:#ffd6e9}a:hover{color:#fff}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#080b20;color:#eef0ff;font-family:Archivo,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <!-- head -->
  <div style="display:flex;align-items:center;gap:12px;padding:54px 16px 10px;border-bottom:1px solid rgba(255,45,143,.3)">
    <button aria-label="Back" style="width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(8,11,32,.6);color:#fff;font-size:16px">‹</button>
    <div style="width:40px;height:40px;border-radius:50%;background:#5b2a3e;border:2px solid #ff2d8f;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800">D</div>
    <div style="flex:1;min-width:0">
      <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;line-height:1;color:#fff">Dex</div>
      <div style="font-family:'Azeret Mono',monospace;font-size:8.5px;letter-spacing:.16em;color:#2de3d0;margin-top:3px">IN A CHAIR TONIGHT · 8:00 PM</div>
    </div>
    <button style="border:none;border-radius:999px;padding:8px 12px;font-family:'Azeret Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.14em;color:#fff;background:linear-gradient(180deg,#ff8ac2,#ff2d8f 46%,#c60d68);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 #8c0847">WATCH</button>
  </div>
  <!-- the match beat -->
  <div style="text-align:center;padding:18px 16px 6px">
    <div style="font-family:'Azeret Mono',monospace;font-size:9px;letter-spacing:.2em;color:rgba(238,240,255,.5)">YOU MATCHED · TUESDAY</div>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;color:#ff8ac2;margin-top:4px">He was in the chair when you ♥'d him.</div>
  </div>
  <!-- thread -->
  <div style="flex:1;padding:8px 16px;display:flex;flex-direction:column;gap:8px;overflow:hidden">
    <div style="max-width:80%;align-self:flex-start;background:rgba(238,240,255,.08);border:1px solid rgba(238,240,255,.15);border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:14.5px;line-height:1.35">hey — you were great on the bench last week</div>
    <div style="max-width:80%;align-self:flex-end;background:rgba(255,45,143,.25);border:1px solid rgba(255,45,143,.6);border-radius:16px 16px 4px 16px;padding:10px 13px;font-size:14.5px;line-height:1.35">ha. Marla passed on me in 40 seconds</div>
    <div style="max-width:80%;align-self:flex-start;background:rgba(238,240,255,.08);border:1px solid rgba(238,240,255,.15);border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:14.5px;line-height:1.35">her loss. I'm hosting Thursday. come sit.</div>
    <div style="align-self:center;margin-top:6px;font-family:'Azeret Mono',monospace;font-size:8.5px;letter-spacing:.16em;color:rgba(238,240,255,.45);border:1px dashed rgba(238,240,255,.25);border-radius:999px;padding:6px 12px">AFTER PARTY OPENS WHEN THE SHOW ENDS</div>
  </div>
  <!-- composer -->
  <div style="display:flex;gap:8px;padding:10px 16px 30px;border-top:1px solid rgba(238,240,255,.1)">
    <label for="msg" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message</label>
    <input id="msg" type="text" placeholder="Say something…" style="flex:1;background:rgba(238,240,255,.07);border:1px solid rgba(238,240,255,.25);border-radius:999px;padding:12px 14px;color:#eef0ff;font-size:14px;font-family:Archivo,sans-serif">
    <button style="border:none;border-radius:999px;padding:0 18px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(180deg,#ff8ac2,#ff2d8f 46%,#c60d68);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 #8c0847">Send</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
